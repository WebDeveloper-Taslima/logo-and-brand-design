<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1f26"/>
      <stop offset="60%" stop-color="#101216"/>
      <stop offset="100%" stop-color="#08090b"/>
    </radialGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="75%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Outer Dark Badge Canvas -->
  <circle cx="400" cy="400" r="380" fill="url(#bgGrad)" stroke="#262B35" stroke-width="6"/>

  <!-- Motorcycle Tire Tread Border Outer Ring -->
  <circle cx="400" cy="400" r="365" fill="none" stroke="#10B981" stroke-width="4" stroke-dasharray="14 10" opacity="0.6"/>
  <circle cx="400" cy="400" r="350" fill="none" stroke="url(#goldGrad)" stroke-width="8" filter="url(#dropShadow)"/>
  <circle cx="400" cy="400" r="332" fill="none" stroke="#334155" stroke-width="3"/>

  <!-- Rivets around border -->
  <g fill="#94A3B8" stroke="#0F172A" stroke-width="2">
    <circle cx="400" cy="45" r="7"/>
    <circle cx="651" cy="149" r="7"/>
    <circle cx="755" cy="400" r="7"/>
    <circle cx="651" cy="651" r="7"/>
    <circle cx="400" cy="755" r="7"/>
    <circle cx="149" cy="651" r="7"/>
    <circle cx="45" cy="400" r="7"/>
    <circle cx="149" cy="149" r="7"/>
    <!-- intermediate rivets -->
    <circle cx="530" cy="79" r="5"/>
    <circle cx="721" cy="270" r="5"/>
    <circle cx="721" cy="530" r="5"/>
    <circle cx="530" cy="721" r="5"/>
    <circle cx="270" cy="721" r="5"/>
    <circle cx="79" cy="530" r="5"/>
    <circle cx="79" cy="270" r="5"/>
    <circle cx="270" cy="79" r="5"/>
  </g>

  <!-- Crossed Motorcycle Pistons in Background -->
  <g id="crossedPistons" opacity="0.4" filter="url(#dropShadow)">
    <!-- Piston Left-to-Right -->
    <g transform="translate(400,400) rotate(45) translate(-400,-400)">
      <rect x="365" y="160" width="70" height="90" rx="8" fill="url(#chromeGrad)" stroke="#0F172A" stroke-width="4"/>
      <line x1="365" y1="185" x2="435" y2="185" stroke="#0F172A" stroke-width="3"/>
      <line x1="365" y1="205" x2="435" y2="205" stroke="#0F172A" stroke-width="3"/>
      <rect x="382" y="250" width="36" height="300" fill="url(#chromeGrad)" stroke="#0F172A" stroke-width="4"/>
      <circle cx="400" cy="570" r="35" fill="url(#chromeGrad)" stroke="#0F172A" stroke-width="6"/>
      <circle cx="400" cy="570" r="15" fill="#0F172A"/>
    </g>
    <!-- Piston Right-to-Left -->
    <g transform="translate(400,400) rotate(-45) translate(-400,-400)">
      <rect x="365" y="160" width="70" height="90" rx="8" fill="url(#chromeGrad)" stroke="#0F172A" stroke-width="4"/>
      <line x1="365" y1="185" x2="435" y2="185" stroke="#0F172A" stroke-width="3"/>
      <line x1="365" y1="205" x2="435" y2="205" stroke="#0F172A" stroke-width="3"/>
      <rect x="382" y="250" width="36" height="300" fill="url(#chromeGrad)" stroke="#0F172A" stroke-width="4"/>
      <circle cx="400" cy="570" r="35" fill="url(#chromeGrad)" stroke="#0F172A" stroke-width="6"/>
      <circle cx="400" cy="570" r="15" fill="#0F172A"/>
    </g>
  </g>

  <!-- Big Realistic Cannabis Fan Leaf Silhouette in Background -->
  <g id="cannabisLeaf" transform="translate(400, 390) scale(1.15) translate(-400, -390)" filter="url(#dropShadow)">
    <!-- Center Main Leaflet -->
    <path d="M400,120 Q418,220 422,380 Q400,410 378,380 Q382,220 400,120 Z" fill="url(#leafGrad)" stroke="#064E3B" stroke-width="2"/>
    <path d="M400,120 L400,410" stroke="#6EE7B7" stroke-width="2" opacity="0.6"/>

    <!-- Left 1 Leaflet -->
    <path d="M400,390 C360,340 280,240 270,180 C300,230 350,330 395,395 Z" fill="url(#leafGrad2)" stroke="#064E3B" stroke-width="2"/>
    <!-- Right 1 Leaflet -->
    <path d="M400,390 C440,340 520,240 530,180 C500,230 450,330 405,395 Z" fill="url(#leafGrad2)" stroke="#064E3B" stroke-width="2"/>

    <!-- Left 2 Leaflet -->
    <path d="M398,395 C340,360 220,320 180,300 C240,340 330,380 392,402 Z" fill="url(#leafGrad)" stroke="#064E3B" stroke-width="2"/>
    <!-- Right 2 Leaflet -->
    <path d="M402,395 C460,360 580,320 620,300 C560,340 470,380 408,402 Z" fill="url(#leafGrad)" stroke="#064E3B" stroke-width="2"/>

    <!-- Left 3 Bottom Leaflet -->
    <path d="M395,402 C330,400 220,430 190,450 C250,440 340,420 392,410 Z" fill="url(#leafGrad2)" stroke="#064E3B" stroke-width="1.5"/>
    <!-- Right 3 Bottom Leaflet -->
    <path d="M405,402 C470,400 580,430 610,450 C550,440 460,420 408,410 Z" fill="url(#leafGrad2)" stroke="#064E3B" stroke-width="1.5"/>

    <!-- Stem -->
    <path d="M398,410 Q400,470 400,490 Q402,470 402,410 Z" fill="#047857"/>
  </g>

  <!-- Motorcycle Gang Biker Helmet & Skull with Goggles (Central Icon) -->
  <g id="bikerSkull" transform="translate(0, 15)" filter="url(#dropShadow)">
    <!-- Helmet Base -->
    <path d="M290,340 C290,240 330,210 400,210 C470,210 510,240 510,340 C510,365 500,385 490,390 C475,395 325,395 310,390 C300,385 290,365 290,340 Z" fill="#1E2430" stroke="url(#chromeGrad)" stroke-width="5"/>
    
    <!-- Helmet Ridge / German M40 / Classic Biker Cut style curve -->
    <path d="M280,355 Q400,325 520,355 L525,370 Q400,340 275,370 Z" fill="url(#goldGrad)"/>

    <!-- Skull Forehead & Face -->
    <path d="M315,355 C315,320 345,300 400,300 C455,300 485,320 485,355 C485,410 475,445 460,475 C450,495 440,505 440,545 L360,545 C360,505 350,495 340,475 C325,445 315,410 315,355 Z" fill="#E2E8F0" stroke="#0F172A" stroke-width="4"/>

    <!-- Biker Aviator / Riding Goggles Band -->
    <rect x="280" y="360" width="240" height="18" rx="4" fill="#0F172A"/>
    
    <!-- Left Goggle -->
    <rect x="315" y="340" width="70" height="55" rx="16" fill="#111827" stroke="url(#goldGrad)" stroke-width="6"/>
    <ellipse cx="350" cy="367" rx="26" ry="18" fill="#10B981" opacity="0.85" filter="url(#neonGlow)"/>
    <ellipse cx="358" cy="360" rx="14" ry="6" fill="#FFFFFF" opacity="0.7"/>

    <!-- Right Goggle -->
    <rect x="415" y="340" width="70" height="55" rx="16" fill="#111827" stroke="url(#goldGrad)" stroke-width="6"/>
    <ellipse cx="450" cy="367" rx="26" ry="18" fill="#10B981" opacity="0.85" filter="url(#neonGlow)"/>
    <ellipse cx="458" cy="360" rx="14" ry="6" fill="#FFFFFF" opacity="0.7"/>

    <!-- Goggle Bridge -->
    <rect x="385" y="360" width="30" height="12" rx="3" fill="url(#chromeGrad)" stroke="#0F172A" stroke-width="2"/>

    <!-- Skull Cheekbones & Nose Cavity -->
    <path d="M390,445 L400,425 L410,445 L405,455 L395,455 Z" fill="#0F172A"/>

    <!-- Skull Teeth / Jaw -->
    <g fill="#CBD5E1" stroke="#0F172A" stroke-width="2">
      <rect x="370" y="495" width="10" height="22" rx="2"/>
      <rect x="382" y="495" width="10" height="24" rx="2"/>
      <rect x="395" y="495" width="10" height="24" rx="2"/>
      <rect x="408" y="495" width="10" height="24" rx="2"/>
      <rect x="420" y="495" width="10" height="22" rx="2"/>
    </g>

    <!-- Jaw Bottom Plate -->
    <path d="M365,525 Q400,535 435,525 L430,545 Q400,555 370,545 Z" fill="#94A3B8" stroke="#0F172A" stroke-width="3"/>
  </g>

  <!-- Motorcycle Club Rocker Ribbons / Banners -->

  <!-- TOP ROCKER PATH -->
  <path id="topRockerCurve" d="M 130 380 A 285 285 0 0 1 670 380" fill="none" />
  <path d="M 160,250 C 230,170 320,135 400,135 C 480,135 570,170 640,250 L 610,290 C 550,230 480,195 400,195 C 320,195 250,230 190,290 Z" fill="#0B0D11" stroke="url(#goldGrad)" stroke-width="4" filter="url(#dropShadow)" opacity="0.95"/>
  
  <text font-family="'Impact', 'Arial Black', sans-serif" font-size="44" font-weight="900" letter-spacing="9" fill="#FFFFFF">
    <textPath href="#topRockerCurve" startOffset="50%" text-anchor="middle">
      IRON &amp; LEAF
    </textPath>
  </text>

  <!-- BOTTOM ROCKER PATH -->
  <path id="bottomRockerCurve" d="M 160 480 A 270 270 0 0 0 640 480" fill="none" />
  <path d="M 175,525 C 240,610 320,645 400,645 C 480,645 560,610 625,525 L 595,490 C 540,560 475,590 400,590 C 325,590 260,560 205,490 Z" fill="#0B0D11" stroke="url(#goldGrad)" stroke-width="4" filter="url(#dropShadow)" opacity="0.95"/>

  <text font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" letter-spacing="7" fill="#10B981">
    <textPath href="#bottomRockerCurve" startOffset="50%" text-anchor="middle">
      CULTIVATION CO.
    </textPath>
  </text>

  <!-- M.C. Club Cube Badges -->
  <g transform="translate(615, 360)">
    <rect width="65" height="55" rx="8" fill="#0B0D11" stroke="url(#goldGrad)" stroke-width="3" filter="url(#dropShadow)"/>
    <text x="32" y="38" font-family="'Arial Black', sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">MC</text>
  </g>

  <!-- EST 2024 / LOCAL GROW Cube Badge -->
  <g transform="translate(120, 360)">
    <rect width="65" height="55" rx="8" fill="#0B0D11" stroke="url(#goldGrad)" stroke-width="3" filter="url(#dropShadow)"/>
    <text x="32" y="30" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#10B981" text-anchor="middle">CRAFT</text>
    <text x="32" y="47" font-family="'Arial Black', sans-serif" font-size="13" font-weight="bold" fill="#CBD5E1" text-anchor="middle">GROW</text>
  </g>

  <!-- Sub-ribbon Banner at Very Bottom: OUTLAW BOTANICALS • 100% ORGANIC -->
  <g transform="translate(230, 680)">
    <rect x="0" y="0" width="340" height="36" rx="18" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <text x="170" y="23" font-family="'Arial', sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#E2E8F0" text-anchor="middle">
      OUTLAW BOTANICALS • 21+ ONLY
    </text>
  </g>
</svg>
